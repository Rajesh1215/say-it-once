<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Aether Shorts">
  <title>Aether Shorts</title>
  <!-- a 9:16 phone; inside, a waveform whose dead middle is cut to one breath (the dot) -->
  <rect x="17" y="4" width="30" height="56" rx="8" fill="none" stroke="#c6f36b" stroke-width="4.5"/>
  <g stroke="#c6f36b" stroke-width="3.6" stroke-linecap="round">
    <line x1="23.5" y1="28" x2="23.5" y2="36"/>
    <line x1="28" y1="23" x2="28" y2="41"/>
    <line x1="36" y1="23" x2="36" y2="41"/>
    <line x1="40.5" y1="28" x2="40.5" y2="36"/>
  </g>
  <circle cx="32" cy="32" r="2.2" fill="#c6f36b"/>
</svg>
